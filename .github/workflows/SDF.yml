name: SILVETON ARRANGER - Android APK

# Upload (replace) SILVETON-ARRANGER.zip in the root of main.
# The ZIP is unpacked on the GitHub runner, NOT in the repository.
on:
  push:
    branches: [main]
    paths:
      - 'SILVETON-ARRANGER.zip'
      - '.github/workflows/SDF.yml'
  workflow_dispatch:

# Releases need contents: write. Without it, the APK can build but cannot be published.
permissions:
  contents: write

# Do not publish older builds after newer ones when pushes arrive close together.
concurrency:
  group: silveton-arranger-apk-release
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build, verify and publish direct APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - name: Checkout SDF repository
        uses: actions/checkout@v4

      - name: Unpack SILVETON-ARRANGER.zip automatically
        shell: bash
        run: |
          set -euo pipefail
          test -s SILVETON-ARRANGER.zip || {
            echo 'ERROR: Upload SILVETON-ARRANGER.zip to the repository root on main.' >&2
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import os

          dest = Path(os.environ['RUNNER_TEMP']) / 'arranger-source'
          dest.mkdir(parents=True, exist_ok=True)
          with ZipFile('SILVETON-ARRANGER.zip') as archive:
              names = archive.namelist()
              if not names:
                  raise SystemExit('ERROR: The source ZIP is empty')
              for name in names:
                  p = PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or '\\' in name:
                      raise SystemExit('ERROR: Unsafe ZIP path: ' + name)
              bad = archive.testzip()
              if bad:
                  raise SystemExit('ERROR: Damaged ZIP entry: ' + bad)
              archive.extractall(dest)
          source = dest / 'silveton_pro_payload'
          required = [
              source / 'CMakeLists.txt',
              source / 'android/app/build.gradle.kts',
              source / 'core/CMakeLists.txt',
              dest / 'scripts/check_android_package.py',
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit('ERROR: Required source file missing: ' + str(path))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ARRANGER_SOURCE=' + str(source) + '\n')
              output.write('ARRANGER_ROOT=' + str(dest) + '\n')
          print('Unpacked and checked', len(names), 'ZIP entries')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android@v3 still tries to install obsolete `sdkmanager tools`.
      # Google removed that package; v4 installs command-line tools and platform-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK 35, NDK 27 and CMake
        shell: bash
        run: |
          set -euo pipefail
          # The v4 setup action already accepts the Android SDK licenses.
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Configure APK signing (optional persistent release key)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SILVETON_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SILVETON_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SILVETON_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SILVETON_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" || -n "$STORE_PASSWORD" || -n "$KEY_ALIAS" || -n "$KEY_PASSWORD" ]]; then
            [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
              echo 'ERROR: Signing requires all four SILVETON_ANDROID secrets.' >&2
              exit 1
            }
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/silveton-release.keystore"
            chmod 600 "$RUNNER_TEMP/silveton-release.keystore"
            echo "SILVETON_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/silveton-release.keystore" >> "$GITHUB_ENV"
            echo "SILVETON_ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SILVETON_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SILVETON_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'SIGNING_MODE=release' >> "$GITHUB_ENV"
            echo 'Signing with persistent release key.'
          else
            echo 'SIGNING_MODE=ci-test' >> "$GITHUB_ENV"
            echo 'WARNING: Using a temporary CI debug key. Later versions may NOT install over this APK.'
          fi

      - name: Check PCM, Drum Kit and sampler regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$ARRANGER_SOURCE/core" -B "$RUNNER_TEMP/silveton-core-tests" \
            -DCMAKE_BUILD_TYPE=Release -DSILVETON_LIVE_BUILD_TESTS=ON
          cmake --build "$RUNNER_TEMP/silveton-core-tests" --parallel 2 --target \
            silveton_pa5x_sample_tests silveton_pa5x_drumkit_tests \
            silveton_pa5x_set_bank_tests silveton_sampler_tests
          ctest --test-dir "$RUNNER_TEMP/silveton-core-tests" --output-on-failure \
            -R '^silveton_(pa5x_sample|pa5x_drumkit|pa5x_set_bank|sampler)_tests$'

      # Compare all 10 HOME buttons with the original Pa5X v1.4 pane order.
      # Touch-tests exercise actual renderer hit regions, player focus and FX navigation.
      - name: Verify HOME panes, Drum Editor and touch navigation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$ARRANGER_SOURCE" -B "$RUNNER_TEMP/silveton-home-ui-tests" \
            -DCMAKE_BUILD_TYPE=Release -DIMAK_BUILD_TESTS=ON
          cmake --build "$RUNNER_TEMP/silveton-home-ui-tests" --parallel 2 --target \
            silveton_pa5x_home_tabs_ui_tests silveton_arranger_chord_ui_tests silveton_drum_edit_ui_tests
          ctest --test-dir "$RUNNER_TEMP/silveton-home-ui-tests" --output-on-failure \
            -R '^(silveton_pa5x_home_tabs_ui_tests|silveton_arranger_chord_ui_tests|silveton_drum_edit_ui_tests)$'

      - name: Compile Android ARM64 release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ARRANGER_SOURCE/android"
          gradle --no-daemon --console=plain --max-workers=3 assembleRelease 2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-build.log"
          ORIGINAL_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$ORIGINAL_APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          # The download filename never changes. The app version is inside its manifest.
          cp "$ORIGINAL_APK" "$GITHUB_WORKSPACE/output/SILVETON-ARRANGER.apk"

      - name: Verify package, native code, signature and version
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/output/SILVETON-ARRANGER.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging "$APK" > "$GITHUB_WORKSPACE/output/APK_BADGING.txt"
          grep -q "package: name='com.silveton.arranger.panel'" "$GITHUB_WORKSPACE/output/APK_BADGING.txt"
          python3 "$ARRANGER_ROOT/scripts/check_android_package.py" "$APK" \
            --build-tools "$BT" \
            --gradle-file "$ARRANGER_SOURCE/android/app/build.gradle.kts" \
            --report "$GITHUB_WORKSPACE/output/APK_VERIFICATION.json"
          "$BT/apksigner" verify --verbose --print-certs "$APK" \
            > "$GITHUB_WORKSPACE/output/APK_SIGNATURE.txt"
          sha256sum "$APK" > "$GITHUB_WORKSPACE/output/SILVETON-ARRANGER.apk.sha256"
          echo 'APK successfully verified.'

      - name: Publish verified APK as direct-download GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          APK="$GITHUB_WORKSPACE/output/SILVETON-ARRANGER.apk"
          CHECKSUM="$GITHUB_WORKSPACE/output/SILVETON-ARRANGER.apk.sha256"
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$ARRANGER_SOURCE/android/app/build.gradle.kts" | head -n 1)"
          test -n "$VERSION"
          gh release create "$TAG" "$APK" "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SILVETON ARRANGER $VERSION (Android ARM64)" \
            --notes "Automatic release built from SILVETON-ARRANGER.zip. Source commit: $GITHUB_SHA. APK verification passed. Signing: $SIGNING_MODE. Device playback tests have NOT been performed by GitHub Actions." \
            --latest
          DIRECT="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/SILVETON-ARRANGER.apk"
          VERSIONED="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SILVETON-ARRANGER.apk"
          # Check an actual APK asset exists in the published release.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name == "SILVETON-ARRANGER.apk") | .browser_download_url' \
            | grep -Fqx "$VERSIONED"
          {
            echo "## SILVETON ARRANGER $VERSION — Android APK"
            echo ''
            echo "[Download APK directly]($DIRECT)"
            echo ''
            echo "[Exact build APK]($VERSIONED)"
            echo ''
            echo "Signing mode: $SIGNING_MODE. A tablet audio/MIDI test is still required."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DIRECT APK: $DIRECT"

      - name: Keep build logs for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SILVETON-ARRANGER-BUILD-REPORT
          path: |
            gradle-build.log
            output/APK_BADGING.txt
            output/APK_VERIFICATION.json
            output/APK_SIGNATURE.txt
          if-no-files-found: ignore
          retention-days: 14
